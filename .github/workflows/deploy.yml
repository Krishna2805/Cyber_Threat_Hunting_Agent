name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets context is not allowed in a job-level `if:`, so expose only
    # whether EC2_HOST is set and skip the deploy step when it is not.
    env:
      HAS_EC2_HOST: ${{ secrets.EC2_HOST != '' }}
    steps:
      - name: Deploy to EC2
        if: env.HAS_EC2_HOST == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Cyber_Threat_Hunting_Agent
            git pull origin main
            /home/ubuntu/.local/bin/uv sync
            sudo systemctl restart soc-backend soc-agent soc-dashboard
